version: 2

models:
  - name: customers
    description: One row per customer with a summary of their order history.
    columns:
      - name: customer_id
        description: Unique identifier for the customer.
        data_tests:
          - unique
          - not_null

      - name: first_name
        description: Customer's first name.

      - name: last_name
        description: Customer's last name.

      - name: first_order_date
        description: Date of the customer's first order, when they have placed an order.

      - name: most_recent_order_date
        description: Date of the customer's most recent order, when they have placed an order.

      - name: number_of_orders
        description: Total number of orders the customer has placed.


